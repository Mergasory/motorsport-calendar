name: Update Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # elke maandag 06:00

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytz requests

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit & Push (bulletproof)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # voeg bestand toe
          git add calendar.ics

          # commit (faalt niet als geen wijzigingen)
          git commit -m "auto update calendar" || echo "no changes"

          # force push = geen conflicts ooit
          git push --force
